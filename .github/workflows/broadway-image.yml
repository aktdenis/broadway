# Builds and pushes the Broadway service Docker image to ghcr.io on every
# push to main. The image is then used by broadway.sdl.yaml on Akash.

name: Broadway image

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "broadway.sdl.yaml"
      - ".github/workflows/broadway-image.yml"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/broadway

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       ./dashboard
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
