# Builds and pushes the Broadway service Docker image to ghcr.io on every
# push to main. The image is then used by broadway.sdl.yaml on Akash.

name: Broadway image

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "broadway.sdl.yaml"
      - ".github/workflows/broadway-image.yml"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/broadway

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
